name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Adiciona um serviço de banco de dados que roda em um container Docker
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: larica_db
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        # Health check para garantir que o banco está pronto antes de iniciar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        # Passa as credenciais do banco de dados como variáveis de ambiente para o Maven
        # O Spring Boot irá automaticamente pegá-las e sobrescrever o application.properties
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/larica_db
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: mvn -B clean install
