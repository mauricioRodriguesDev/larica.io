# ===================================================================
#      Larica.io API - Main Configuration
# ===================================================================

# --- Application ---
spring.application.name=larica

# --- PostgreSQL Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/larica_db
spring.datasource.username=postgres
spring.datasource.password=155157

# --- Flyway Configuration ---
# Database migrations are enabled and managed by Flyway.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# --- Data Initialization ---
# Data seeding is handled by Flyway's V4 migration.
# Spring's data.sql is disabled.
spring.sql.init.mode=never

# --- OpenWeatherMap API Configuration ---
# The API Key is loaded from an environment variable for security.
openweathermap.api.url=https://api.openweathermap.org/data/2.5/weather
openweathermap.api.key=${OPENWEATHERMAP_API_KEY}
# --- Código da cidade do RJ ---
openweathermap.city.id=3451190 
